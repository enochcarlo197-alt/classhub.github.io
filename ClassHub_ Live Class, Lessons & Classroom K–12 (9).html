<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassHub: Live Class, Lessons & Classroom K–12</title>
<style>
:root{--bg:#f2f6ff;--card:#fff;--ink:#16213a;--mute:#5d6b8c;--pri:#2f6bff;--acc:#ff9f1c;--ok:#12a36b;--bad:#e5484d;--line:#dbe3f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1628;--card:#18213b;--ink:#eef2ff;--mute:#9aa8cc;--pri:#6b96ff;--acc:#ffb347;--ok:#35c98d;--bad:#ff6b70;--line:#2a3558;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1628;--card:#18213b;--ink:#eef2ff;--mute:#9aa8cc;--pri:#6b96ff;--acc:#ffb347;--ok:#35c98d;--bad:#ff6b70;--line:#2a3558;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;color:var(--pri)}.logo b{color:var(--acc)}
.sp{margin-left:auto}main{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--pri);color:#fff}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button.on{background:var(--pri);color:#fff}
button:disabled{opacity:.45;cursor:default}
select,input{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.note{color:var(--mute);font-size:14px}
.room{display:grid;gap:14px;grid-template-columns:1fr 340px}@media(max-width:820px){.room{grid-template-columns:1fr}}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);margin:8px 0;padding:13px}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.exp{border-left:4px solid var(--acc);background:var(--bg);padding:10px 14px;border-radius:8px;margin:10px 0}
.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{aspect-ratio:4/3;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;position:relative}
.tile small{font-size:10px;font-weight:600;position:absolute;bottom:3px}.tile .h{position:absolute;top:2px;right:4px;font-size:15px}
#log{height:230px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:8px;font-size:14px}
.m{margin:5px 0}.m b{color:var(--pri)}.m.me{text-align:right}
.hand{background:var(--acc);color:#16213a;width:100%;padding:12px;font-size:16px}
.big{font-size:44px;font-weight:800;color:var(--pri)}
h2,h3{margin:.2em 0 .4em}
</style>
</head>
<body>
<header><div class="logo">Class<b>Hub</b></div><div id="hd" class="row sp"></div></header>
<main id="app"></main>
<script>
const P=(g,s,t,i,q)=>({g,s,t,i,q});
const LIB=[
P("K","Science","Animals & Their Homes",[["Animals Live Everywhere","Animals need a home to stay safe, warm, and find food. A home is called a habitat. Some animals live on land, some in water, and some in both."],["Different Homes","Birds build nests in trees. Bears sleep in caves. Fish live in oceans, rivers, and lakes. Bees live together in a hive."],["What Animals Need","Every animal needs food, water, air, and shelter. A habitat gives animals all four things."]],[["Where does a fish live?",["In a nest","In water","In a hive"],1,"Fish have gills to breathe underwater, so water is their habitat."],["What is a home for animals called?",["A habitat","A garden","A road"],0,"A habitat is the place that gives an animal food, water, air, and shelter."]]),
P("1","Math","Adding Within 10",[["What Is Adding?","Adding means putting groups together to find the total. We use the plus sign (+) and the equals sign (=). Example: 3 + 2 = 5."],["Counting On","Start with the bigger number and count up. For 6 + 3, say 6 and count 7, 8, 9. The answer is 9."],["Number Partners","Pairs that make 10 are called partners: 1+9, 2+8, 3+7, 4+6, 5+5. Knowing them makes adding faster."]],[["What is 4 + 3?",["6","7","8"],1,"Start at 4 and count on 3 more: 5, 6, 7. So 4 + 3 = 7."],["Which number is the partner of 6 to make 10?",["3","4","5"],1,"6 + 4 = 10, so 4 is the partner of 6."]]),
P("2","English","Nouns, Verbs & Sentences",[["Nouns","A noun names a person, place, or thing: teacher, park, ball. Proper nouns name special things and start with capital letters, like Texas."],["Verbs","A verb shows action: run, jump, read. Verbs tell what someone or something does."],["Complete Sentences","A sentence has a subject (who or what) and a verb (what it does). It starts with a capital letter and ends with punctuation. “The dog barks.” is complete."]],[["Which word is a verb?",["happy","swim","tree"],1,"Swim is an action word, so it is a verb. Happy describes and tree names a thing."],["Which is a complete sentence?",["Runs fast.","The cat sleeps.","Big red ball."],1,"“The cat sleeps.” has a subject (cat) and a verb (sleeps)."]]),
P("3","Math","Fractions Are Parts",[["What Is a Fraction?","A fraction shows equal parts of a whole. The bottom number (denominator) says how many equal parts. The top number (numerator) says how many we have."],["Reading Fractions","If a pizza is cut into 8 equal slices and you eat 3, you ate 3/8. Parts must always be equal."],["Comparing","When denominators match, the bigger numerator is bigger: 5/8 > 3/8. With the same numerator, the smaller denominator means bigger pieces: 1/2 > 1/4."]],[["A pie has 4 equal parts and 1 is eaten. What fraction was eaten?",["1/4","4/1","1/2"],0,"1 part out of 4 equal parts is 1/4."],["Which is bigger?",["1/4","1/2","They are equal"],1,"Halves are larger pieces than fourths, so 1/2 > 1/4."]]),
P("4","Science","States of Matter",[["Three Common States","Matter is anything with mass that takes up space. Solids keep their shape, liquids take the shape of their container, and gases spread out to fill any space."],["Particles","In solids, particles are packed tightly and vibrate. In liquids they slide past each other. In gases they move quickly and are far apart."],["Changing State","Heating melts solids and boils liquids. Cooling freezes liquids and condenses gases. Water can be ice, liquid, or steam."]],[["What happens to water when it freezes?",["It becomes a gas","It becomes a solid","It disappears"],1,"Cooling water to 0°C (32°F) makes particles lock into place, forming solid ice."],["Which state has particles that are far apart and move quickly?",["Solid","Liquid","Gas"],2,"Gas particles have lots of energy and spread out to fill their container."]]),
P("5","History","The Thirteen Colonies",[["Three Regions","Britain founded thirteen colonies along the Atlantic coast. They are grouped into New England, the Middle Colonies, and the Southern Colonies."],["Why They Differed","New England had rocky soil, so people turned to fishing, shipbuilding, and trade. The Middle Colonies grew grain. Southern colonies had long growing seasons for tobacco, rice, and indigo."],["Daily Life","Colonists were governed by Britain but made local laws through assemblies. Their growing independence set the stage for the American Revolution."]],[["Which region was known for fishing and shipbuilding?",["Southern Colonies","New England","Middle Colonies"],1,"Rocky soil limited farming in New England, so people used the sea for work."],["Why did Southern colonies grow tobacco and rice?",["Long growing seasons and warm weather","Cold winters","Rocky soil"],0,"Warm climate and fertile land supported large cash-crop farms."]]),
P("6","Science","Ecosystems & Food Webs",[["What Is an Ecosystem?","An ecosystem is all the living things (biotic) and non-living things (abiotic) in an area interacting together, such as plants, animals, soil, water, and sunlight."],["Energy Flow","Producers (plants) make food from sunlight. Consumers eat producers or other consumers. Decomposers like fungi break down dead matter and return nutrients to soil."],["Food Webs","A food web shows many connected food chains. Only about 10% of energy passes to the next level, so there are fewer top predators than plants."]],[["Which organism is a producer?",["Grass","Rabbit","Fox"],0,"Grass makes its own food using photosynthesis, so it is a producer."],["What do decomposers do?",["Hunt prey","Break down dead matter","Make food from sunlight"],1,"Decomposers recycle nutrients from dead organisms back into the ecosystem."]]),
P("7","Math","Ratios & Proportions",[["What Is a Ratio?","A ratio compares two quantities. 3 boys to 5 girls can be written 3:5, 3 to 5, or 3/5. Order matters."],["Unit Rates","A unit rate compares to one unit: 120 miles in 2 hours is 60 miles per hour. Divide to find it."],["Proportions","A proportion says two ratios are equal: 2/3 = 4/6. Cross-multiply to check or to solve for a missing value."]],[["A recipe uses 2 cups flour to 1 cup sugar. How much flour for 3 cups sugar?",["4 cups","5 cups","6 cups"],2,"The ratio 2:1 scales up: 3 cups of sugar needs 3 × 2 = 6 cups of flour."],["What is the unit rate for 150 miles in 3 hours?",["30 mph","50 mph","450 mph"],1,"150 ÷ 3 = 50 miles per hour."]]),
P("8","Science","Newton’s Laws of Motion",[["First Law: Inertia","An object stays at rest or keeps moving at constant velocity unless a net force acts on it. This is why seat belts matter in a sudden stop."],["Second Law: F = ma","Force equals mass times acceleration. A heavier object needs more force to accelerate the same amount. Units: newtons (N)."],["Third Law: Action-Reaction","For every action there is an equal and opposite reaction. A rocket pushes gas down, and the gas pushes the rocket up."]],[["A 2 kg object accelerates at 3 m/s². What is the net force?",["5 N","6 N","1.5 N"],1,"F = m × a = 2 × 3 = 6 N."],["Which law explains why a rocket lifts off?",["First law","Second law","Third law"],2,"The rocket pushes exhaust down, and the equal and opposite reaction pushes it upward."]]),
P("9","Biology","Cells: The Building Blocks",[["Cell Theory","All living things are made of cells, cells are the basic unit of life, and all cells come from existing cells."],["Organelles","The nucleus holds DNA. Mitochondria release energy from food (ATP). Ribosomes build proteins. Chloroplasts, found only in plant cells, perform photosynthesis."],["Prokaryotes vs Eukaryotes","Prokaryotes (bacteria) have no nucleus. Eukaryotes (plants, animals, fungi) have a nucleus and membrane-bound organelles."]],[["Which organelle is the “powerhouse” of the cell?",["Nucleus","Mitochondria","Ribosome"],1,"Mitochondria carry out cellular respiration, making usable energy (ATP)."],["Which cell type has no nucleus?",["Prokaryote","Plant cell","Animal cell"],0,"Prokaryotes, such as bacteria, keep their DNA in the cytoplasm without a nucleus."]]),
P("10","Geometry","The Pythagorean Theorem",[["The Rule","In a right triangle, a² + b² = c², where c is the hypotenuse, the side opposite the right angle and the longest side."],["Worked Example","Legs 3 and 4: 3² + 4² = 9 + 16 = 25, so c = √25 = 5. This is a 3-4-5 triple, and 5-12-13 and 8-15-17 are others."],["Where It’s Used","Builders check square corners, GPS estimates distances, and designers find screen diagonals using this theorem."]],[["Legs are 6 and 8. What is the hypotenuse?",["10","14","12"],0,"6² + 8² = 36 + 64 = 100, and √100 = 10."],["Which side is always the longest in a right triangle?",["A leg","The hypotenuse","Both legs"],1,"The hypotenuse is opposite the largest angle, 90°, so it is longest."]]),
P("11","Civics","The U.S. Constitution",[["Purpose","Written in 1787, the Constitution created a federal government with limited powers. Its Preamble begins “We the People.”"],["Separation of Powers","The legislative branch (Congress) makes laws, the executive (President) enforces them, and the judicial (courts) interprets them. Checks and balances stop any branch from dominating."],["Rights & Change","The first ten amendments form the Bill of Rights. Amending requires two-thirds of Congress and ratification by three-fourths of states, so change is deliberate."]],[["Which branch interprets laws?",["Legislative","Executive","Judicial"],2,"Federal courts, led by the Supreme Court, decide what laws mean."],["What do checks and balances prevent?",["Elections","One branch gaining too much power","State taxes"],1,"Each branch can limit the others, protecting against concentrated power."]]),
P("12","Economics","Supply, Demand & Inflation",[["Supply and Demand","Demand is how much buyers want at each price; supply is how much sellers offer. Price settles where they meet, called equilibrium."],["Shifts","If demand rises while supply stays the same, prices rise. If supply rises while demand stays the same, prices fall."],["Inflation","Inflation is a general rise in prices over time, reducing purchasing power. Central banks like the Federal Reserve raise interest rates to cool it."]],[["Demand for a product jumps but supply stays fixed. What happens to price?",["It rises","It falls","No change"],0,"More buyers competing for the same quantity pushes the price up."],["What does inflation reduce?",["Taxes","Purchasing power","Supply"],1,"When prices rise, each dollar buys less than before."]])
];
const GR=["K",...Array.from({length:12},(_,i)=>String(i+1))];
const TEACH="Your teacher",KIDS=["Ava","Ben","Chloe","Dev","Ella","Finn"],COL=["#2f6bff","#e5484d","#12a36b","#8b5cf6","#e08a00","#0ea5b7","#d6336c"];
let S={role:"student",grade:"K",view:"class",pid:null,step:0,picked:null,hand:false,hands:[],ch:"class",msgs:{class:[],bot:[]},score:0,done:{},posts:{},att:{},ended:false,essays:[],unlock:false,rc:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gl=g=>g==="K"?"Kindergarten":"Grade "+g;
function hd(){document.getElementById("hd").innerHTML=
`<select onchange="S.grade=this.value;S.view=S.view==='room'?'class':S.view;render()">${GR.map(g=>`<option value="${g}" ${g===S.grade?"selected":""}>${gl(g)}</option>`).join("")}</select>
<button class="${S.role==="student"?"on":"g"}" onclick="S.role='student';render()">Student</button><button class="${S.role==="teacher"?"on":"g"}" onclick="S.role='teacher';render()">Teacher</button>
<button class="${S.view==="class"?"on":"g"}" onclick="S.view='class';render()">Classroom</button><button class="${S.view==="lib"?"on":"g"}" onclick="S.view='lib';render()">Library</button>`}
function render(){hd();const a=document.getElementById("app");if(locked()){a.innerHTML=lockScr();return}a.innerHTML=S.view==="room"?room():S.view==="lib"?lib():cls();if(S.view==="room"&&!S.ended)side()}
function card(p,i){const d=S.done[p.t];return `<div class="card"><div class="row"><span class="pill">${gl(p.g)}</span><span class="pill">${p.s}</span>${d!=null?`<span class="pill" style="color:var(--ok)">✓ ${d}/${p.q.length}</span>`:""}</div><h3>${p.t}</h3><p class="note">${p.i.length} info slides · ${p.q.length} questions with explanations</p><button onclick="openRoom(${LIB.indexOf(p)})">${S.role==="teacher"?"Start live class":"Join class"}</button></div>`}
function cls(){const ps=LIB.filter(p=>p.g===S.grade),po=S.posts[S.grade]||[];
 return `<div class="card"><h2>${gl(S.grade)} Classroom</h2><p class="note">Teacher: ${TEACH} · Class code: HUB-${S.grade==="K"?"00":S.grade.padStart(2,"0")}</p>
 ${S.role==="teacher"?`<div class="row"><input id="pi" placeholder="Post an announcement…" style="flex:1"><button onclick="post()">Post</button></div>`:""}</div>
 <div class="card"><b>Stream</b>${[...po,`${TEACH}: Welcome to ${gl(S.grade)}! Join live class when it starts and use ✋ to ask questions.`].map(x=>`<div class="exp">${esc(x)}</div>`).join("")}</div>
 ${essays()}<h3>Assignments & live lessons</h3><div class="grid">${ps.map(card).join("")}</div>
 <p class="note">More presentations for every grade are in the Library tab.</p>`}
function post(){const v=document.getElementById("pi").value.trim();if(!v)return;(S.posts[S.grade]=S.posts[S.grade]||[]).unshift(TEACH+": "+v);render()}
function lib(){return GR.map(g=>{const ps=LIB.filter(p=>p.g===g);return ps.length?`<h3>${gl(g)}</h3><div class="grid">${ps.map(card).join("")}</div>`:""}).join("")}
/* ---- room ---- */
let seq=[];
function openRoom(i){const p=LIB[i];S.pid=i;S.grade=p.g;seq=[{k:"i",d:p.i[0]},{k:"i",d:p.i[1]},{k:"q",d:p.q[0]},{k:"i",d:p.i[2]},{k:"v",d:VX[p.g]},{k:"q",d:p.q[1]}];
 S.step=0;S.picked=null;S.hand=false;S.hands=[];S.score=0;S.ended=false;S.att={};S.view="room";S.msgs={class:[[TEACH,`Welcome to ${p.t}! Raise your hand if you have a question.`]],bot:[["Study Buddy","Hi! I’m Study Buddy. Ask me about anything on the slides, or type “hint” on a question."]]};render()}
function room(){const p=LIB[S.pid],t=S.role==="teacher";if(S.ended)return dism(p,t);
 let h=`<div class="row" style="margin-bottom:10px"><button class="g" onclick="S.view='class';render()">← Leave class</button><b>${p.t}</b><span class="pill">${gl(p.g)} · ${p.s}</span><span class="pill">${Math.min(S.step+1,seq.length)} / ${seq.length}</span>${t?'<button style="background:var(--bad);margin-left:auto" onclick="endClass()">End class & dismiss</button>':""}</div><div class="room"><div>`;
 if(S.step>=seq.length)return h+fin(p)+`</div><div id="side"></div></div>`;
 const it=seq[S.step];
 if(it.k==="i")h+=`<div class="card"><h2>${esc(it.d[0])}</h2><p style="font-size:${[24,19,18,17][band(p.g)]}px">${esc(it.d[1])}</p><div class="exp"><b>${DEEP[band(p.g)][0]}</b> ${esc(DEEP[band(p.g)][1].replace("#",it.d[0]))}</div>${t?`<div class="exp"><b>Teacher talking point:</b> ${TP[band(p.g)]}</div>`:""}</div>`;
 else if(it.k==="v")h+=vocab(it,t,p);else{const[q,o,a,e]=it.d,pk=S.picked;
  h+=`<div class="card"><span class="pill">Question</span><h2>${esc(q)}</h2>${o.map((x,k)=>`<button class="opt ${pk!==null||t?(k===a?"right":pk===k?"wrong":""):""}" ${pk!==null||t?"disabled":""} onclick="pick(${k})">${esc(x)}</button>`).join("")}
  ${pk!==null?`<div class="exp"><b>${pk===a?"✅ Correct!":"❌ Not quite."}</b> ${esc(e)}</div>`:""}${t?`<div class="exp"><b>Answer key:</b> ${esc(o[a])}. ${esc(e)}</div>`:""}</div>`}
 const need=it.k==="q"&&S.picked===null&&!t;
 return h+`<div class="row"><button class="g" ${S.step===0?"disabled":""} onclick="go(-1)">← Back</button><button ${need?"disabled":""} onclick="go(1)">${S.step===seq.length-1?"Finish":"Next →"}</button>${need?'<span class="note">Pick an answer to continue</span>':""}</div></div><div id="side"></div></div>`}
function pick(k){S.picked=k;if(k===seq[S.step].d[2])S.score++;render()}
function go(d){S.step+=d;S.picked=null;if(S.role==="teacher"&&seq[S.step]&&seq[S.step].k==="q"&&!S.hands.length)setTimeout(()=>{S.hands.push(KIDS[Math.random()*6|0]);if(S.view==="room")side()},1500);
 if(S.step>=seq.length&&S.role==="student")S.done[LIB[S.pid].t]=S.score;render()}
function fin(p){const o=LIB.filter(x=>x!==p).sort(()=>Math.random()-.5).slice(0,3);
 return `<div class="card" style="text-align:center"><div class="big">🎉 ${S.score}/${p.q.length}</div><h2>${p.t} complete!</h2><p class="note">Great work. Here are more presentations to keep going:</p></div><div class="grid">${o.map(card).join("")}</div>`}
function side(){const t=S.role==="teacher",el=document.getElementById("side");if(!el)return;
 const names=[TEACH,...KIDS,"You"].slice(0,8);
 el.innerHTML=`<div class="card"><div class="vids">${names.map((n,k)=>`<div class="tile" style="background:${COL[k%7]}">${n==="You"?(t?"T":"Y"):n[0]}<small>${n==="You"?(t?TEACH:"You"):n}</small>${S.hands.includes(n)||(n==="You"&&S.hand)?'<span class="h">✋</span>':""}</div>`).join("")}</div>
 ${t?`<p><b>Raised hands (${S.hands.length})</b></p>${S.hands.map(n=>`<div class="row"><span>✋ ${n}</span><button class="g" onclick="call('${n}')">Call on</button></div>`).join("")||'<span class="note">No hands raised</span>'}`
 :`<p><button class="hand" onclick="hand()">${S.hand?"✋ Lower hand":"✋ Raise hand"}</button></p>`}</div>
 ${t?attCard():stuAtt()}<div class="card"><div class="row"><button class="${S.ch==="class"?"on":"g"}" onclick="S.ch='class';side()">${t?"Class chat":"Chat with teacher"}</button><button class="${S.ch==="bot"?"on":"g"}" onclick="S.ch='bot';side()">🤖 Study Buddy</button></div>
 <div id="log" style="margin-top:8px">${S.msgs[S.ch].map(m=>`<div class="m ${m[0]==="You"?"me":""}"><b>${esc(m[0])}:</b> ${esc(m[1])}</div>`).join("")}</div>
 <div class="row" style="margin-top:8px"><input id="ci" style="flex:1;min-width:0" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></div>`;
 const l=document.getElementById("log");l.scrollTop=l.scrollHeight}
function hand(){S.hand=!S.hand;if(S.hand)setTimeout(()=>{if(!S.hand)return;S.hand=false;S.msgs.class.push([TEACH,nx("h")]);if(S.view==="room")side()},3500);side()}
function call(n){S.hands=S.hands.filter(x=>x!==n);S.msgs.class.push([TEACH,`${n}, you’re up!`]);setTimeout(()=>{S.msgs.class.push([n,nx("c")]);if(S.view==="room")side()},1200);side()}
function send(){const i=document.getElementById("ci"),v=i.value.trim();if(!v)return;const c=S.ch,lm=S.msgs[c].filter(m=>m[0]==="You").pop();if(lm&&lm[1]===v){i.value="";i.placeholder="You already sent that message.";return}S.msgs[c].push(["You",v]);const t=S.role==="teacher";
 setTimeout(()=>{let r;if(c==="bot")r=["Study Buddy",bot(v)];else r=t?[nxName(),nx("k")]:[TEACH,nx("t")];
  S.msgs[c].push(r);if(S.view==="room"&&S.ch===c)side()},700);side();document.getElementById("ci").focus()}
function bot(m){const p=LIB[S.pid],w=m.toLowerCase().match(/[a-z0-9]{3,}/g)||[],it=seq[S.step];
 if(/hint|stuck|help/.test(m.toLowerCase())&&it&&it.k==="q"){const best=p.i.map(x=>x[0]);return `Hint: re-read the info slides, especially “${best[Math.min(S.step>2?2:1,best.length-1)]}”. Think about which option matches the key idea, and rule out answers that don’t fit.`}
 let top=null,sc=0;p.i.forEach((s,k)=>{(s[1]).split(/(?<=[.!?])\s+/).forEach(x=>{const n=w.filter(y=>x.toLowerCase().includes(y)).length;if(n>sc){sc=n;top=[k+1,x]}})});

function saveBio(){DB.doc("teachers/"+S.me).set({name:S.name,bio:document.getElementById("bio").value.trim()}).catch(()=>{})}
function dir(){return `<div class="card"><h2>Our teachers</h2><p class="note">${S.role==="student"?"Message a teacher with a question, or to ask about joining their class.":"Teachers on ClassHub. New teachers join with the school’s teacher code."}</p></div><div class="grid">${TC.map(t=>`<div class="card"><h3>👩‍🏫 ${esc(t.name)}</h3><p class="note">${esc(t.bio||"No bio yet.")}</p>${t.id!==S.me?`<button onclick="openDM('${t.id}')">Message</button>`:'<span class="pill">You</span>'}</div>`).join("")||'<p class="note">No teachers have signed up yet.</p>'}</div>`}
function openDM(id){const t=TC.find(x=>x.id===id);S.dmo={id,name:t?t.name:id};S.view="dm";render()}
function dmHtml(){return DM.filter(m=>m.p.includes(S.dmo.id)).sort((a,b)=>a.t-b.t).map(m=>`<div class="m ${m.f===S.me?"me":""}"><b>${esc(m.n)}:</b> ${esc(m.x)}</div>`).join("")||'<span class="note">No messages yet. Say hello!</span>'}
function dmView(){return `<div class="card"><button class="g" onclick="S.view='${S.role==="teacher"?"class":"dir"}';render()">← Back</button><h2>Chat with ${esc(S.dmo.name)}</h2><div id="dml" style="height:260px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:8px">${dmHtml()}</div><div class="row" style="margin-top:8px"><input id="dmi" style="flex:1" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendDM()"><button onclick="sendDM()">Send</button></div></div>`}
function sendDM(){const i=document.getElementById("dmi"),v=i.value.trim();if(!v||!DB)return;i.value="";DB.doc("dm/"+uid()).set({p:[S.me,S.dmo.id],f:S.me,n:S.name,x:v,t:Date.now()}).catch(()=>{})}
function inbox(){const o={};[...DM].sort((a,b)=>a.t-b.t).forEach(m=>{const id=m.p.find(x=>x!==S.me);o[id]={name:m.f===S.me?(o[id]&&o[id].name)||"Student":m.n,last:m.x}});S.ibx=o;const k=Object.keys(o);
 return `<div class="card"><h3>📬 Messages</h3>${k.map(i=>`<div class="row"><b>${esc(o[i].name)}</b><span class="note" style="flex:1">${esc(o[i].last.slice(0,60))}</span><button class="g" onclick="S.dmo={id:'${i}',name:S.ibx['${i}'].name};S.view='dm';render()">Open</button></div>`).join("")||'<p class="note">No messages from students yet.</p>'}</div>`}
function render(){hd();const a=document.getElementById("app");if(locked()){a.innerHTML=lockScr();return}if(!S.me){a.innerHTML=authScr();return}
 if(S.view!=="room"&&S.inRoom){S.inRoom=0;put("mem",S.me,null);put("hands",S.me,null)}
 a.innerHTML=S.view==="room"?room2():S.view==="lobby"?lobby():S.view==="dir"?dir():S.view==="dm"?dmView():S.view==="lib"?lib():cls();if(S.view==="room"&&!RS.ended){side();initCv()}}
render();
</script>
</body>
</html>
